<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time API Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <h1>Real-Time API Project</h1>
        <p>Products, search, category filter, cart count, remove from cart, and total price in one beginner-friendly app.</p>
      </div>
      <div class="cart-panel" aria-live="polite">
        <div class="cart-badge" id="cartCount">0</div>
        <div class="cart-info">
          <div><strong>Cart Items</strong></div>
          <div class="cart-total" id="cartTotalHeader">Total = $0.00</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <section class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search products like shirt" />
      <button class="btn-clear" id="clearBtn">Clear Filters</button>
    </section>

    <section class="categories">
      <button class="cat-btn active" data-category="all">All</button>
      <button class="cat-btn" data-category="electronics">electronics</button>
      <button class="cat-btn" data-category="jewelery">jewelery</button>
      <button class="cat-btn" data-category="men's clothing">men's clothing</button>
      <button class="cat-btn" data-category="women's clothing">women's clothing</button>
    </section>

    <div id="statusMessage" class="status-msg">Fetching products...</div>

    <div class="content-layout">
      <div id="productGrid" class="product-grid"></div>

      <aside class="cart-sidebar">
        <h2 class="cart-title">Shopping Cart</h2>
        <div id="cartItems" class="cart-items-list"></div>
        <div class="cart-summary">
          <span>Items <span id="cartItemCount">0</span></span>
          <span>Total <strong id="cartTotal">$0.00</strong></span>
        </div>
      </aside>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
